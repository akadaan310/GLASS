name: GLASS Vitromaton ARM64 APK
on:
  push:
    branches: [main]
    paths:
      - 'apps/glass-vitro-terminal/**'
      - '.github/workflows/glass-terminal-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C++ acceptance tests
        run: |
          cmake -S apps/glass-vitro-terminal -B /tmp/vitro-build -G Ninja
          cmake --build /tmp/vitro-build
          ctest --test-dir /tmp/vitro-build --output-on-failure
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install NDK and CMake
        run: sdkmanager --install 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build GLASS ARM64 debug APK
        working-directory: apps/glass-vitro-terminal/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GLASS-Vitromaton-arm64-debug
          path: apps/glass-vitro-terminal/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
