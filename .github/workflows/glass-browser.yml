name: GLASS Native Browser
on:
  push:
    branches: [main]
    paths:
      - 'apps/glass-browser/**'
      - '.github/workflows/glass-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Native ledger and C ABI tests
        run: bash apps/glass-browser/tools/test_host.sh
  android-debug:
    needs: native-host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Provision explicit Android toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build debug APK (not release signed)
        working-directory: apps/glass-browser/android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: glass-browser-debug-arm64
          path: apps/glass-browser/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
