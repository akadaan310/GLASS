plugins { id 'com.android.application' }
android { namespace 'dev.glass.browser'; compileSdk 35
 defaultConfig { applicationId 'dev.glass.browser'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra' } } }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 if (!project.hasProperty('geckoviewVersion')) throw new GradleException('Pass -PgeckoviewVersion=<published stable GeckoView version>')
 implementation "org.mozilla.geckoview:geckoview:${project.property('geckoviewVersion')}"
}
