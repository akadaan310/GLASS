plugins { id 'com.android.application' }
android {
    namespace 'com.glass.unison'
    compileSdk 35
    defaultConfig {
        applicationId 'com.glass.unison'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra' } }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' version '3.22.1' } }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    // Apache 2.0-licensed Termux terminal-view and terminal-emulator libraries.
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
}
