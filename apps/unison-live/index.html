<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020611"><title>UNISON · GLASS</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020611;color:#dcefff;font-family:ui-monospace,Consolas,monospace}#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 18%,rgba(0,0,0,.66) 100%)}#header{position:fixed;top:5vh;left:6vw;pointer-events:none;font-size:clamp(14px,3vw,22px);letter-spacing:.55em;opacity:.72}#brand{position:fixed;top:12vh;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(16px,3vw,36px);letter-spacing:.3em;color:#c7faff;text-shadow:0 0 28px #33c7f090;pointer-events:none}#oracle{position:fixed;left:6vw;right:6vw;top:52%;transform:translateY(-50%);text-align:center;pointer-events:none}#glyph{font-size:clamp(25px,5vw,76px);min-height:1.3em;color:#b8fbef;text-shadow:0 0 40px #4cf6e0a0;overflow-wrap:anywhere}#meaning{font-size:clamp(11px,2.4vw,17px);letter-spacing:.18em;color:#a1bac4;margin-top:1.6rem}#dock{position:fixed;bottom:9vh;left:6vw;right:6vw;display:flex;align-items:center;gap:15px;border-bottom:1px solid #76dbdb80;background:linear-gradient(90deg,transparent,#0a22315c,transparent);padding:12px 0}#q{width:100%;border:0;outline:0;background:transparent;color:#e7ffff;font:clamp(18px,3.3vw,34px) ui-monospace,monospace;caret-color:#a3ffff}#q::placeholder{color:#73949a}#mark{font-size:28px;color:#7cebe3}#status{position:fixed;right:5vw;bottom:3vh;color:#7daaa9;font-size:11px;letter-spacing:.2em;pointer-events:none}#clock{position:fixed;left:5vw;bottom:3vh;color:#7daaa9;font-size:11px;letter-spacing:.2em;pointer-events:none}@media(prefers-reduced-motion:reduce){#sky{opacity:.7}}
</style></head><body><canvas id="sky"></canvas><div id="shade"></div><div id="header">⟦جَ⟧ ◉ ⟐ K↔Q ۞</div><div id="brand">UNISON</div><div id="oracle"><div id="glyph">Λ → Ω → Γ → ۞</div><div id="meaning">EACH LETTER OPENS AN ORACLE</div></div><div id="dock"><span id="mark">⟐</span><input id="q" aria-label="Unison search and universal input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a word, URL, clock, /mirror…"></div><div id="clock">⊙ 00000000</div><div id="status">∿ LIVE · LOCAL</div>
<script>
'use strict';
const cv=document.querySelector('#sky'),ctx=cv.getContext('2d',{alpha:false}),inp=document.querySelector('#q'),glyph=document.querySelector('#glyph'),meaning=document.querySelector('#meaning'),clock=document.querySelector('#clock'),status=document.querySelector('#status');
const alphabet=new Map();let W=0,H=0,dpr=1,ticks=0,angle=0,stamp=0;
const seg=s=>typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('und',{granularity:'grapheme'}).segment(s)].map(v=>v.segment):Array.from(s);
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function script(c){for(const [n,re] of [['ARABIC',/\p{Script=Arabic}/u],['LATIN',/\p{Script=Latin}/u],['GREEK',/\p{Script=Greek}/u],['CYRILLIC',/\p{Script=Cyrillic}/u],['HAN',/\p{Script=Han}/u],['HEBREW',/\p{Script=Hebrew}/u],['DEVANAGARI',/\p{Script=Devanagari}/u]])if(re.test(c))return n;return /\p{Number}/u.test(c)?'NUMBER':'UNISON'}
function observe(s){const a=seg(s);for(const c of a){const k=script(c)+':'+c,old=alphabet.get(k);alphabet.set(k,{glyph:c,script:script(c),oracle:'Ω'+hash(k).toString(16).padStart(8,'0'),visits:(old?.visits||0)+1})}return a}
function solve(s){let v=s.trim(),a=observe(v);if(!v)return ['Λ → Ω → Γ → ۞','EACH LETTER OPENS AN ORACLE'];if(/^(clock|time|وقت|الوقت)$/iu.test(v))return ['⊙ '+new Date().toLocaleTimeString(),'CLOCK · UNIVERSAL INTERVAL'];const m=v.match(/^\/(mirror|rotate|signature|classify|interleave)\s+(.+)$/iu);if(m){const g=seg(m[2]),op=m[1].toLowerCase();let r=op==='mirror'?g.reverse().join(''):op==='rotate'?g.slice(1).concat(g[0]||'').join(''):op==='classify'?g.map(x=>x+':'+script(x)).join(' ∿ '):op==='signature'?g.map(x=>hash(x+script(x)).toString(16).slice(0,4)).join('·'):g.map((x,i)=>x+g[g.length-1-i]).join('');return [r,'Γ '+op.toUpperCase()+' · DETERMINISTIC GENERATOR']}return [a.slice(-24).map(c=>alphabet.get(script(c)+':'+c)?.oracle).join('  '),'Λ '+a.length+' GRAPHEMES · '+new Set(a.map(script)).size+' FAMILIES · ⟐ '+hash(v).toString(16)]}
function refresh(){let [g,m]=solve(inp.value);glyph.textContent=g;meaning.textContent=m;status.textContent='∿ LIVE · Ω '+alphabet.size+' · SOURCE → AST'}
inp.addEventListener('input',refresh);
inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;let s=inp.value.trim();if(/^(https?:\/\/|[\w-]+(?:\.[\w-]+)+)/i.test(s)){location.href=/^https?:\/\//i.test(s)?s:'https://'+s;return}if(/^search\s+/i.test(s)){location.href='https://www.google.com/search?q='+encodeURIComponent(s.replace(/^search\s+/i,''))}});
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
let points=Array.from({length:900},(_,i)=>{let r=hash('UNISON:'+i);return{x:(r%100000)/100000,y:((r>>>9)%100000)/100000,z:.2+((r>>>18)%1000)/1000,p:r%360,b:.2+(r%17)/22}});
function draw(time){if(document.hidden){requestAnimationFrame(draw);return}ticks++;ctx.fillStyle='#020611';ctx.fillRect(0,0,W,H);let t=time*.00015;for(const p of points){let z=p.z,theta=t*(.07+z*.13),x=(p.x-.5),y=(p.y-.5),cs=Math.cos(theta),sn=Math.sin(theta),px=(x*cs-y*sn)*W*(.7+z*.6)+W/2,py=(x*sn+y*cs)*H*(.7+z*.6)+H/2;if(px<0||px>W||py<0||py>H)continue;let a=.2+.55*(1+Math.sin(time*.0007*(.4+z)+p.p))/2;ctx.fillStyle='rgba(136,218,242,'+(a*p.b)+')';ctx.beginPath();ctx.arc(px,py,Math.max(.35,z*1.8),0,Math.PI*2);ctx.fill()}const cx=W/2,cy=H*.45,sz=Math.min(W,H),n=4;for(let j=0;j<n;j++){let rad=sz*(.1+j*.063),spin=time*.00012*(j%2?-1:1);ctx.beginPath();ctx.ellipse(cx,cy,rad,rad*.48,spin,0,Math.PI*2);ctx.strokeStyle='rgba(80,227,217,'+(.075+j*.03)+')';ctx.lineWidth=.7;ctx.stroke()}clock.textContent='⊙ '+String(ticks).padStart(8,'0');requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.addEventListener('keydown',e=>{if(document.activeElement!==inp&&e.key.length===1&&!e.ctrlKey&&!e.metaKey){inp.focus()}});cv.addEventListener('pointerdown',()=>inp.focus());
refresh();
</script></body></html>
